<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpporTrack - Opportunities</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="brand">⚡ OpporTrack</div>
      <div class="nav-links">
        <a href="dashboard.html">Preferences</a>
        <a href="opportunities.html" class="active">Opportunities</a>
        <button onclick="logout()">Logout</button>
      </div>
    </nav>

    <main class="page">
      <h1>Tumhari Opportunities</h1>
      <p class="subtitle">
        Tumhari selected companies ke hisaab se latest internships.
      </p>
      <div class="grid" id="grid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </main>

    <script>
      const token = localStorage.getItem("token");
      if (!token) location.href = "login.html";

      function logout() {
        localStorage.removeItem("token");
        location.href = "login.html";
      }

      function showMessage(text) {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        const d = document.createElement("div");
        d.className = "empty";
        d.textContent = text;
        grid.appendChild(d);
      }

      async function load() {
        const grid = document.getElementById("grid");
        try {
          const res = await fetch("/api/users/my-opportunities", {
            headers: { Authorization: "Bearer " + token },
          });
          if (res.status === 401 || res.status === 403) {
            logout();
            return;
          }
          const items = await res.json();

          // same job multiple baar aaye to duplicate hata do (link ke basis pe)
          const seen = new Set();
          const unique = items.filter(
            (it) => !seen.has(it.link) && seen.add(it.link),
          );

          if (!unique.length) {
            showMessage(
              "Abhi koi opportunity nahi mili. Dashboard pe companies select karo ya baad mein check karo.",
            );
            return;
          }

          grid.innerHTML = "";
          unique.forEach((it, i) => {
            const card = document.createElement("div");
            card.className = "opp";
            card.style.animationDelay = i * 40 + "ms";

            const top = document.createElement("div");
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = it.source;
            const title = document.createElement("h3");
            title.textContent = it.title;
            top.append(tag, title);

            const a = document.createElement("a");
            a.href = it.link;
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = "Apply →";

            card.append(top, a);
            grid.appendChild(card);
          });
        } catch (e) {
          showMessage("Opportunities load nahi ho payi.");
        }
      }

      load();
    </script>
  </body>
</html>
