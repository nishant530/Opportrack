<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpporTrack - Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <form class="card" id="form">
        <div class="brand">⚡ OpporTrack</div>
        <h2>Welcome back</h2>
        <p class="sub">Login karke apni opportunities dekho.</p>
        <div class="field">
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="field">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>
        <button class="btn" id="btn" type="submit">Login</button>
        <p class="msg" id="msg"></p>
        <p class="link">Naya user? <a href="signup.html">Sign Up</a></p>
      </form>
    </div>

    <script>
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn");

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Logging in...";
        msg.className = "msg";
        msg.textContent = "";
        try {
          const res = await fetch("/api/users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem("token", data.token);
            location.href = "dashboard.html";
            return;
          }
          msg.className = "msg error";
          msg.textContent = "Email ya password galat hai.";
        } catch (err) {
          msg.className = "msg error";
          msg.textContent = "Server se connect nahi ho paya.";
        }
        btn.disabled = false;
        btn.textContent = "Login";
      });
    </script>
  </body>
</html>
