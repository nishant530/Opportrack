<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpporTrack - Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <form class="card" id="form">
        <div class="brand">⚡ OpporTrack</div>
        <h2>Create account</h2>
        <p class="sub">Koi bhi opportunity miss mat karo.</p>
        <div class="field">
          <input type="text" id="name" placeholder="Full name" required />
        </div>
        <div class="field">
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="field">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>
        <button class="btn" id="btn" type="submit">Sign Up</button>
        <p class="msg" id="msg"></p>
        <p class="link">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </form>
    </div>

    <script>
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn");

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Creating...";
        msg.className = "msg";
        msg.textContent = "";
        try {
          const res = await fetch("/api/users/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("name").value,
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });
          if (res.ok) {
            msg.className = "msg ok";
            msg.textContent = "Account ban gaya! Login page pe ja rahe hain...";
            setTimeout(() => (location.href = "login.html"), 1200);
          } else {
            msg.className = "msg error";
            msg.textContent = "Signup fail hua, dobara try karo.";
          }
        } catch (err) {
          msg.className = "msg error";
          msg.textContent = "Server se connect nahi ho paya.";
        }
        btn.disabled = false;
        btn.textContent = "Sign Up";
      });
    </script>
  </body>
</html>
