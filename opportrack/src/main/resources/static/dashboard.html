<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpporTrack - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">⚡ OpporTrack</div>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Preferences</a>
      <a href="opportunities.html">Opportunities</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="page">
    <h1>Apni companies chuno</h1>
    <p class="subtitle">Jin companies/sources ki opportunities chahiye, unhe select karke save karo.</p>
    <div class="chips" id="chips"><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="actions"><button class="btn" onclick="saveSelection()">Save Selection</button></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'login.html';

    function toast(text, type = 'ok') {
      const t = document.getElementById('toast');
      t.textContent = text; t.className = 'toast show ' + type;
      setTimeout(() => t.className = 'toast', 2500);
    }

    function logout() { localStorage.removeItem('token'); location.href = 'login.html'; }

    async function loadCompanies() {
      const box = document.getElementById('chips');
      try {
        const res = await fetch('/api/companies');
        const companies = await res.json();
        box.innerHTML = '';
        if (!companies.length) { box.textContent = 'Abhi koi company available nahi hai.'; return; }
        companies.forEach(c => {
          const label = document.createElement('label'); label.className = 'chip';
          const input = document.createElement('input'); input.type = 'checkbox'; input.value = c.id;
          const span = document.createElement('span'); span.textContent = c.name;
          label.append(input, span); box.appendChild(label);
        });
      } catch (e) { box.textContent = 'Companies load nahi ho payi.'; }
    }

    async function saveSelection() {
      const ids = [...document.querySelectorAll('#chips input:checked')].map(i => Number(i.value));
      try {
        const res = await fetch('/api/users/select-companies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(ids)
        });
        if (res.ok) toast('Preferences save ho gayi ✓');
        else if (res.status === 401 || res.status === 403) logout();
        else toast('Save nahi hua', 'error');
      } catch (e) { toast('Server error', 'error'); }
    }

    loadCompanies();
  </script>
</body>
</html>
